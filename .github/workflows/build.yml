name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Ringkas error build
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong|Resource linking|AAPT" -A1 "$RUNNER_TEMP/build.log" | grep -v '^--$' | head -25 | while IFS= read -r l; do echo "::error::${l:0:400}"; done || true

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/ZipTonton-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZipTonton-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ZipTonton build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: out/*.apk

      - name: Kirim ke ApkSwift
        continue-on-error: true   # gagal kirim ke situs tidak boleh membatalkan rilis APK
        env:
          APK_PATH: out/ZipTonton-${{ github.run_number }}.apk
          TAG: build-${{ github.run_number }}
          BUILD_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          CHANGELOG: ${{ github.event.head_commit.message }}
          APKSWIFT_USER: ${{ secrets.APKSWIFT_USER }}
          APKSWIFT_PASS: ${{ secrets.APKSWIFT_PASS }}
          APKSWIFT_DEPLOY_TOKEN: ${{ secrets.APKSWIFT_DEPLOY_TOKEN }}
        run: node .github/scripts/publish-apkswift.mjs
